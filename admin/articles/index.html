<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статьи и знания | Лавка Шамана</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/images/icon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/products.css">
  <link rel="stylesheet" href="/knowledge/knowledge.css">
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="eyebrow">Контент и модерация</p>
        <h1>Статьи и знания</h1>
      </div>
      <nav class="admin-nav" aria-label="Админ-навигация">
        <a href="/admin/products">Товары</a>
        <a href="/admin/banners">Баннеры</a>
        <a class="is-active" href="/admin/articles">Статьи</a>
        <a href="/admin/orders">Заказы</a>
        <a href="/admin/payments">Платежи</a>
        <a href="/admin/promocodes">Промокоды</a>
        <a href="/knowledge">Библиотека</a>
        <a href="/knowledge/compose">Редактор</a>
      </nav>
    </header>

    <main class="admin-layout">
      <aside class="product-list-panel">
        <div class="panel-head">
          <div>
            <h2>Материалы</h2>
            <span id="article-count">0 материалов</span>
          </div>
          <a class="button button--gold" href="/knowledge/compose">Новый</a>
        </div>
        <div class="record-list" id="article-list"></div>
      </aside>

      <section class="editor-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Модерация</p>
            <h2 id="detail-title">Выберите материал</h2>
          </div>
          <div class="editor-actions">
            <a class="button" id="edit-link" href="/knowledge/compose">Редактировать</a>
            <button class="button button--gold" id="publish-button" type="button">Опубликовать</button>
            <button class="button" id="archive-button" type="button">В архив</button>
          </div>
        </div>

        <div class="record-detail">
          <section class="detail-section">
            <h3>Карточка статьи</h3>
            <div class="detail-row"><span>Статус</span><strong id="detail-status">—</strong></div>
            <div class="detail-row"><span>Автор</span><strong id="detail-author">—</strong></div>
            <div class="detail-row"><span>Раздел</span><strong id="detail-section">—</strong></div>
            <div class="detail-row"><span>Тип</span><strong id="detail-type">—</strong></div>
            <div class="detail-row"><span>Ссылка</span><strong id="detail-link">—</strong></div>
            <div class="detail-row"><span>Статистика</span><strong id="detail-stats">—</strong></div>
            <div class="detail-row"><span>Описание</span><strong id="detail-excerpt">—</strong></div>
          </section>

          <section class="detail-section">
            <h3>Комментарии</h3>
            <div class="detail-items" id="comment-list"></div>
          </section>

          <section class="detail-section">
            <div class="detail-toolbar">
              <h3>Разделы</h3>
            </div>
            <form class="product-form" id="section-form">
              <input type="hidden" name="id">
              <div class="form-grid">
                <label>
                  <span>Название раздела</span>
                  <input name="title" maxlength="120" required>
                </label>
                <label>
                  <span>Slug</span>
                  <input name="slug" maxlength="120">
                </label>
              </div>
              <div class="form-grid">
                <label>
                  <span>Родительский раздел</span>
                  <select name="parentId" id="section-parent"></select>
                </label>
                <label>
                  <span>Порядок</span>
                  <input name="sortOrder" type="number" step="1">
                </label>
              </div>
              <label>
                <span>Описание</span>
                <textarea name="description" rows="3" maxlength="420"></textarea>
              </label>
              <label class="toggle-row">
                <input name="isActive" type="checkbox" checked>
                <span>Раздел активен</span>
              </label>
              <div class="editor-actions">
                <button class="button" id="reset-section" type="button">Сбросить</button>
                <button class="button button--gold" type="submit">Сохранить раздел</button>
              </div>
            </form>
            <div class="record-list" id="section-list"></div>
          </section>
        </div>
      </section>
    </main>

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>

  <noscript><div><img src="https://mc.yandex.ru/watch/108620522" style="position:absolute; left:-9999px;" alt=""></div></noscript>
  <script src="/yandex-metrika.js" defer></script>
  <script src="/admin/articles.js"></script>
</body>
</html>
