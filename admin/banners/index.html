<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Баннеры | Лавка Шамана</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/images/icon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/products.css">
</head>
<body data-admin-view="banners">
  <div class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="eyebrow">Витрина каталога</p>
        <h1>Баннеры</h1>
      </div>
      <nav class="admin-nav" aria-label="Админ-навигация">
        <a href="/admin/products">Товары</a>
        <a class="is-active" href="/admin/banners">Баннеры</a>
        <a href="/admin/articles">Статьи</a>
        <a href="/admin/orders">Заказы</a>
        <a href="/admin/payments">Платежи</a>
        <a href="/admin/promocodes">Промокоды</a>
        <a href="/">Сайт</a>
        <a href="/chat/admin">Чат</a>
        <a href="/chat">Войти</a>
      </nav>
    </header>

    <main class="admin-layout">
      <aside class="product-list-panel">
        <div class="panel-head">
          <div>
            <h2>Категории</h2>
            <span id="banner-count">0 баннеров</span>
          </div>
          <button class="button button--gold" type="button" id="new-banner">Новый</button>
        </div>
        <div class="product-list" id="banner-list" aria-live="polite"></div>
      </aside>

      <section class="editor-panel" aria-labelledby="editor-title">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Карточка баннера</p>
            <h2 id="editor-title">Новый баннер</h2>
          </div>
          <div class="editor-actions">
            <button class="button" type="button" id="delete-banner">Удалить</button>
            <button class="button button--gold" type="button" id="save-banner">Сохранить</button>
          </div>
        </div>

        <form class="product-form" id="banner-form">
          <input type="hidden" name="id">

          <div class="form-grid">
            <label>
              <span>Заголовок</span>
              <input name="title" type="text" maxlength="160" required>
            </label>
            <label>
              <span>Категория товаров</span>
              <input name="category" type="text" maxlength="160" required placeholder="Например Медовая продукция">
            </label>
          </div>

          <div class="form-grid">
            <label>
              <span>Alt-текст</span>
              <input name="altText" type="text" maxlength="240">
            </label>
            <label>
              <span>Порядок</span>
              <input name="sortOrder" type="number" step="1">
            </label>
          </div>

          <div class="media-row">
            <div class="image-preview image-preview--banner" id="banner-preview"></div>
            <div class="media-fields">
              <label>
                <span>Ссылка на изображение</span>
                <input name="imageUrl" type="text" maxlength="500" placeholder="/images/banner3.jpg">
              </label>
              <label>
                <span>Загрузить новое изображение</span>
                <input name="imageFile" type="file" accept="image/*">
              </label>
            </div>
          </div>

          <label class="toggle-row">
            <input name="isActive" type="checkbox">
            <span>Показывать на сайте</span>
          </label>
        </form>
      </section>
    </main>

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>

  <noscript><div><img src="https://mc.yandex.ru/watch/108620522" style="position:absolute; left:-9999px;" alt=""></div></noscript>
  <script src="/yandex-metrika.js" defer></script>
  <script src="/admin/banners.js" defer></script>
</body>
</html>
