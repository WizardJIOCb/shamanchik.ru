<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Платежи | Лавка Шамана</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/images/icon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/products.css">
</head>
<body data-admin-view="payments">
  <div class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="eyebrow">Админка магазина</p>
        <h1>Платежи</h1>
      </div>
      <nav class="admin-nav" aria-label="Админ-навигация">
        <a href="/admin/products">Товары</a>
        <a href="/admin/orders">Заказы</a>
        <a class="is-active" href="/admin/payments">Платежи</a>
        <a href="/admin/promocodes">Промокоды</a>
        <a href="/">Сайт</a>
        <a href="/chat/admin">Чат</a>
        <a href="/chat">Войти</a>
      </nav>
    </header>

    <section class="store-settings-panel" aria-labelledby="payments-summary-title">
      <div class="panel-head">
        <div>
          <p class="eyebrow">ЮКасса</p>
          <h2 id="payments-summary-title">Сводка по платежам</h2>
          <span id="orders-summary-status">Загрузка платежей...</span>
        </div>
        <button class="button" type="button" id="refresh-orders">Обновить</button>
      </div>
      <div class="summary-grid" id="orders-summary"></div>
    </section>

    <main class="admin-layout">
      <aside class="product-list-panel">
        <div class="panel-head">
          <div>
            <h2>Платежи</h2>
            <span id="record-count">0 платежей</span>
          </div>
        </div>
        <div class="record-list" id="record-list" aria-live="polite"></div>
      </aside>

      <section class="editor-panel" aria-labelledby="record-title">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Карточка платежа</p>
            <h2 id="record-title">Платёж не выбран</h2>
          </div>
        </div>
        <div class="record-detail" id="record-detail">
          <p class="record-empty">Выберите платёж слева, чтобы посмотреть заказ, ссылку оплаты и статус.</p>
        </div>
      </section>
    </main>

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>

  <noscript><div><img src="https://mc.yandex.ru/watch/108620522" style="position:absolute; left:-9999px;" alt=""></div></noscript>
  <script src="/yandex-metrika.js" defer></script>
  <script src="/admin/orders.js" defer></script>
</body>
</html>
